<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ciccio's" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="CICCIO'S — The Burger Adventure. Demo concept di un platform pixel art giocabile da telefono e computer." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- the logo starts downloading now, not after the game bundle has run -->
    <link rel="preload" as="image" href="./brand/ciccios-logo.png" fetchpriority="high" />
    <title>CICCIO'S — The Burger Adventure</title>
    <style>
      /* Critical pre-paint styles so nothing flashes white before the CSS bundle loads. */
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #app { position: fixed; inset: 0; background: #000; }
      /* Static splash: paints before any JS; createUI removes it when the UI mounts. */
      #cc-splash {
        position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; background: #000;
        color: #fff; font-family: "Helvetica Neue", Arial, sans-serif; pointer-events: none;
      }
      /* same logo and size as the loading screen; shown only once fully loaded */
      #cc-splash img { height: clamp(84px, 16vh, 140px); aspect-ratio: 607 / 1040; opacity: 0; transition: opacity 260ms ease-out; }
      #cc-splash span { font-size: 15px; letter-spacing: 0.08em; color: #e4cca8; animation: cc-splash 1s steps(2) infinite; }
      @keyframes cc-splash { 50% { opacity: 0.45; } }
    </style>
  </head>
  <body>
    <div id="cc-splash" aria-live="polite">
      <img src="./brand/ciccios-logo.png" alt="CICCIO'S" fetchpriority="high" onload="this.style.opacity = 1" />
      <span>Caricamento…</span>
    </div>
    <div id="app"></div>
    <noscript style="position:relative;z-index:2;color:#fce4c0;font-family:sans-serif;display:block;padding:24px">
      Per giocare abilita JavaScript.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
